spring.application.name=Backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:skillsync_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo}

gemini.api.key=${GEMINI_API_KEY:mock-key}
spring.main.web-application-type=servlet